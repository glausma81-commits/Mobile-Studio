<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mobile Studio</title>
    <meta name="description" content="Kuratierte Portraitfotografie und Video-Portraits von Mobile Studio by Martin. Geschützte Galerieansicht für Indoor- und Outdoor-Portraits." />
    <meta property="og:title" content="Mobile Studio" />
    <meta property="og:description" content="Kuratierte Portraitfotografie und Video-Portraits von Mobile Studio by Martin. Geschützte Galerieansicht für Indoor- und Outdoor-Portraits." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('mobile-studio-theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F9EEF1] text-black dark:bg-[#111113] dark:text-[#D9859B] antialiased selection:bg-[#9F3A58] selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
